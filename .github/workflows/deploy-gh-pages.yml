name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x
      - name: Install and build
        run: |
          yarn --frozen-lockfile
          # optional overrides from Settings → Secrets and variables →
          # Actions → Variables (fall back to .env.production when unset)
          if [ -n "$COLLAB_SERVER_URL" ]; then
            export VITE_APP_WS_SERVER_URL="$COLLAB_SERVER_URL"
          fi
          if [ -n "$FIREBASE_CONFIG" ]; then
            export VITE_APP_FIREBASE_CONFIG="$FIREBASE_CONFIG"
          fi
          yarn --cwd ./excalidraw-app vite build --base=/${{ github.event.repository.name }}/
        env:
          CI: true
          VITE_APP_DISABLE_SENTRY: true
          VITE_APP_GIT_SHA: ${{ github.sha }}
          # self-hosted excalidraw-room on Railway (CORS_ORIGIN=https://wsoule.github.io)
          COLLAB_SERVER_URL: ${{ vars.COLLAB_SERVER_URL || 'https://excalidraw-room-production-f4cb.up.railway.app' }}
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
      - name: Publish to gh-pages branch
        run: |
          cd excalidraw-app/build
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
